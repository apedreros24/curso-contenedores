apiVersion: v1
kind: Pod
metadata:
  labels:
    app: jenkins-agent-arlette-pedreros
spec:
  containers:
    - name: node
      image: node:24-alpine
      command:
        - cat
      tty: true
      workingDir: /home/jenkins/agent
    - name: docker
      image: docker:27-cli
      command:
        - cat
      tty: true
      workingDir: /home/jenkins/agent
      volumeMounts:
        - name: docker-sock
          mountPath: /var/run/docker.sock
    - name: kubectl
      image: bitnami/kubectl:latest
      command:
        - cat
      tty: true
      workingDir: /home/jenkins/agent
  volumes:
    - name: docker-sock
      hostPath:
        path: /var/run/docker.sock
